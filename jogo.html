<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Missão ON</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: palco 16:9 com cenário de jogo, controles de toque abaixo, cartões em estilo planta azul (blueprint) sobre o jogo.
   Marca ON Engenharia: azul #72AFE0 sobre marinho #1D3140, tipografia geométrica como o logo. Visual único por escolha. */
:root{
  --navy:#1D3140;
  --navy-deep:#12202C;
  --navy-line:#2E4A62;
  --on:#72AFE0;
  --on-bright:#A3CFF0;
  --on-deep:#4C85B8;
  --paper:#EAF4FD;
  --ink:#0F1E2B;
  --white:#FFFFFF;
  --gold:#FFD25A;
  --ok-bg:#CBF1DD; --ok-line:#17A36B;
  --bad-bg:#FFD7D3; --bad-line:#D9443A;
  --warn-bg:#FFF0C7;
  --display:"Montserrat","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--navy);color:var(--paper);font-family:var(--body);font-size:16px;
  padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:block;height:48px;width:auto}
.mute{
  font:800 14px var(--body);color:var(--paper);background:transparent;border:2px solid var(--navy-line);border-radius:999px;
  padding:8px 14px;min-height:40px;cursor:pointer;white-space:nowrap
}
.mute:hover{border-color:var(--on)}
.mute:focus-visible,.pad button:focus-visible,.opt:focus-visible{outline:3px solid var(--on-bright);outline-offset:3px}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--navy-deep);box-shadow:0 0 0 2px var(--navy-line);touch-action:none;margin-inline:auto}
canvas{display:block;width:100%;height:100%}
.pad{display:flex;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.dir{display:flex;gap:12px}
.pad button{
  font-family:var(--display);font-weight:800;font-size:26px;color:var(--paper);background:#27425A;border:3px solid var(--on-deep);
  height:84px;min-width:84px;border-radius:50%;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 5px 0 var(--navy-deep)
}
.pad button.jump{border-radius:42px;min-width:170px;background:var(--on);color:var(--navy-deep);border-color:var(--on-bright);box-shadow:0 5px 0 var(--on-deep);font-size:22px;letter-spacing:.06em}
.pad button.on{transform:translateY(4px);box-shadow:0 1px 0 var(--navy-deep);background:#3A6288}
.pad button.jump.on{background:var(--on-bright);box-shadow:0 1px 0 var(--on-deep)}
.hint{margin:0;font-size:14px;color:#A9BCCB;line-height:1.4}
.hint b{color:var(--paper)}
.only-touch,.tip-rotate{display:none}
@media (pointer:coarse){.only-kb{display:none}.only-touch{display:inline}}
@media (pointer:coarse) and (orientation:portrait){.tip-rotate{display:block}}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media (pointer:coarse) and (orientation:landscape){
  body{padding-block:8px}
  .hint{display:none}
  .logo{height:34px}
  .mute{min-height:34px;padding:4px 12px}
  .wrap{gap:6px}
  .stage{width:min(100%,calc((100vh - 56px) * 16 / 9))}
  .pad{
    position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
    padding:0 max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  }
  .pad button{pointer-events:auto;opacity:.8;height:72px;min-width:72px}
  .pad button.jump{min-width:150px}
}

/* Cartões sobre o jogo: papel de planta azul */
.ov{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:auto;background:rgba(7,14,22,.82);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.card{
  width:100%;max-width:540px;color:var(--white);border-radius:14px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;
  background-color:#172B3D;
  background-image:linear-gradient(rgba(114,175,224,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(114,175,224,.14) 1px,transparent 1px);
  background-size:20px 20px;border:2px solid var(--on);box-shadow:0 8px 0 rgba(0,0,0,.4)
}
.cardlogo{display:block;height:64px;width:auto;align-self:flex-start}
.kicker{margin:0;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--on-bright)}
.card h2{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(26px,6vw,36px);line-height:1.08;text-wrap:balance}
.card .body{display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.5;color:#E3EEF7}
.card .body p{margin:0}
.card .body b{color:var(--white)}
.kb{display:inline-block;font-weight:800;font-size:14px;border:2px solid var(--on);border-bottom-width:4px;border-radius:6px;padding:1px 8px;background:#0F1E2B;color:var(--white)}
.btn{
  font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em;color:var(--navy-deep);background:var(--on);border:0;border-radius:10px;
  min-height:54px;padding:12px 22px;cursor:pointer;box-shadow:0 5px 0 var(--on-deep);align-self:stretch
}
.btn:hover{background:var(--on-bright)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--on-deep)}
.btn:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.card h2.qtitle{font-size:clamp(20px,5vw,26px)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:54px;padding:10px 14px;cursor:pointer;
  font:800 16px/1.3 var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--on);border-radius:10px
}
.opt:hover:not(:disabled){background:var(--white)}
.opt .let{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--on-bright);font:800 15px var(--display)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.5}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.opt.ok .let{background:var(--ok-line);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.opt.bad .let{background:var(--bad-line);color:#fff}
.fb{display:flex;flex-direction:column;gap:12px;padding:12px 14px;border-radius:10px;font-size:15px;line-height:1.45;color:var(--ink)}
.fb p{margin:0}
.fb.good{background:var(--ok-bg)}
.fb.miss{background:var(--warn-bg)}
.stars{margin:0;font-size:40px;letter-spacing:.1em;color:var(--gold);line-height:1}
.stars .off{color:#3C566F}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0;font-size:16px}
.stats dt{font-weight:600;color:#C9DCEB}
.stats dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:var(--white)}
@media (prefers-reduced-motion:reduce){.btn,.pad button{transition:none}}
</style>

}

function ensureAudio(){
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function tone(f,d,type='square',v=0.05,slide=0,delay=0){
  if(!actx || muted) return;
  try{
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.03);
  }catch(e){}
}

function buildLevel(i){
  const d = LEVELS[i], spec = ENEMY[d.theme];
  const plats = [], tools = [];
  let n = 0;
  const add = (x,y) => { tools.push({x,y,type:(n++)%TOOLS.length,got:false,ph:Math.random()*6}); };
  d.ground.forEach(([a,b]) => plats.push({x:a,y:GY,w:b-a,h:200,ground:true}));
  d.plats.forEach(([x,y,w,k]) => {
    plats.push({x,y,w,h:18,v:hs(x,y)});
    for(let j=0;j<k;j++) add(x+w*(j+1)/(k+1), y-26);
  });
  d.rows.forEach(([x0,k,gap]) => { for(let j=0;j<k;j++) add(x0+j*gap, GY-30); });
  return {
    w:d.w, plats, tools,
    enemies:d.enemies.map(([x1,x2]) => ({t:spec.t,x:x1,y:GY-spec.h,w:spec.w,h:spec.h,x1,x2,dir:1,speed:spec.speed,dead:0,anim:Math.random()*5})),
    quiz:d.quiz.map(([x,y],idx) => ({x,y,w:36,h:36,idx,done:false})),
    goal:{x:d.goal,y:GY-70,w:56,h:70}
  };
}

}

/* ---------- Lógica ---------- */
function hurt(){
  G.hearts--; sfx.hurt(); burst(P.x+12,P.y+20,'#FF4D5E',10);
  P.inv = 1.6;
  if(G.hearts <= 0){
    G.state = 'over'; clearKeys(); sfx.over();
    showCard({
      kicker:'Ops!', title:'Acabou a energia',
      body:'<p>Sem problemas. Engenheiros também testam várias vezes até dar certo.</p>',
      btn:'Tentar de novo', onBtn:restartLevel
    });
    return true;
  }
  return false;
}
function collide(L,dt){
  P.x += P.vx*dt;
  for(const s of L.plats){
    if(!s.ground || !overlap(P,s)) continue;
    if(P.vx > 0) P.x = s.x - P.w; else if(P.vx < 0) P.x = s.x + s.w;
    P.vx = 0;
  }
  const oldBottom = P.y + P.h;
  P.y += P.vy*dt; P.on = false;
  for(const s of L.plats){
    if(!overlap(P,s)) continue;
    if(s.ground){
      if(P.vy >= 0){ P.y = s.y - P.h; P.vy = 0; P.on = true; }
      else { P.y = s.y + s.h; P.vy = 0; }
    } else if(P.vy >= 0 && oldBottom <= s.y + 4){
      P.y = s.y - P.h; P.vy = 0; P.on = true;
    }
  }
}
function updatePlay(dt){
  const L = G.L;
  const dir = (keys.right?1:0) - (keys.left?1:0);
  P.vx = approach(P.vx, dir*SPEED, (P.on?2600:1700)*dt);
  if(dir) P.face = dir;
  if(keys.jumpPressed){ P.buf = .12; keys.jumpPressed = false; }
  P.buf -= dt;
  P.coyote = P.on ? .1 : P.coyote - dt;
  if(P.buf > 0 && P.coyote > 0){ P.vy = -JUMP; P.buf = 0; P.coyote = 0; P.on = false; sfx.jump(); }
  if(!keys.jump && P.vy < -260) P.vy = -260;
  P.vy = Math.min(900, P.vy + GRAV*dt);
  collide(L,dt);
  P.x = clamp(P.x, 0, L.w - P.w);
  if(P.inv > 0) P.inv -= dt;
  if(Math.abs(P.vx) > 20 && P.on) P.anim += dt;

  if(P.y > H + 80){
    if(hurt()) return;
    resetPlayer(G.cp.x, G.cp.y); P.inv = 1.6; return;
  }
  // ferramentas
  for(const b of L.tools){
    if(b.got) continue;
    if(Math.abs(b.x-(P.x+12)) < 24 && Math.abs(b.y-(P.y+20)) < 30){
      b.got = true; G.tools++; G.score += 10; G.toolSet.add(b.type); sfx.tool(); burst(b.x,b.y,'#A3CFF0',7);
      if(!G.kitBonus && G.toolSet.size === TOOLS.length){
        G.kitBonus = true; G.score += 100; sfx.kit(); toast('Caixa de ferramentas completa! +100');
      }
    }
  }
  // inimigos
  for(const e of L.enemies){
    if(e.dead){ e.dead += dt; continue; }
    e.anim += dt;
    e.x += e.dir*e.speed*dt;
    if(e.x <= e.x1){ e.x = e.x1; e.dir = 1; }
    if(e.x + e.w >= e.x2){ e.x = e.x2 - e.w; e.dir = -1; }
    if(overlap(P,e)){
      if(P.vy > 0 && (P.y + P.h) - e.y < 22){
        e.dead = 0.0001; P.vy = -430; G.score += 20; sfx.stomp(); burst(e.x+e.w/2,e.y+e.h/2,'#FFFFFF',8);
        if(keys.jump) P.vy = -520;
      } else if(P.inv <= 0){
        P.vy = -360; P.vx = -P.face*220;
        if(hurt()) return;
      }
    }
  }
  L.enemies = L.enemies.filter(e => !(e.dead > .4));
  for(const q of L.quiz){
    if(!q.done && overlap(P,q)){ openQuiz(q); return; }
  }
  if(overlap(P,L.goal)){
    if(G.qDone < 3){
      if(!G.toast || G.toast.t < .3) toast('Responda os 3 desafios (?) antes de ligar');
    } else startLights();
  }
}
function startLights(){
  G.state = 'lights'; G.lit = true; G.lightsT = 0; clearKeys(); sfx.on();
  G.score += 100;
  const g = G.L.goal; burst(g.x+g.w/2, g.y+10, '#72AFE0', 26);
}
function updateLights(dt){
  G.lightsT += dt;
  if(G.lightsT > 2.8){
    G.state = 'card';
    if(G.lvl < LEVELS.length-1){
      showCard({
        kicker:`Fase ${G.lvl+1} completa`, title:LEVELS[G.lvl].done,
        body:`<p>Ferramentas: <b>${G.tools}</b> &nbsp;·&nbsp; Pontos: <b>${G.score}</b></p>`,
        btn:'Próxima fase', onBtn:() => startLevel(G.lvl+1)
      });
    } else showEnd();
  }
}
function update(dt){
  G.t += dt;
  if(G.state === 'play') updatePlay(dt);
  else if(G.state === 'lights') updateLights(dt);
  for(const p of G.parts){ p.life -= dt; p.vy += 600*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  if(G.toast){ G.toast.t -= dt; if(G.toast.t <= 0) G.toast = null; }
  const L = G.L, maxCam = L.w - W;
  if(G.state === 'menu'){ G.cam = (Math.sin(G.t*.15)*.5+.5) * maxCam; }
  else {
    const target = clamp(P.x + P.w/2 - 320, 0, maxCam);
    G.cam = REDUCED ? target : G.cam + (target - G.cam) * Math.min(1, dt*6);
  }
}

/* ---------- Desenho: utilitários ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function hex(cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){ const a = Math.PI/3*i + Math.PI/6; const px = cx+Math.cos(a)*r, py = cy+Math.sin(a)*r; i ? ctx.lineTo(px,py) : ctx.moveTo(px,py); }
  ctx.closePath();
}
function heart(cx,top,s,full){
  const x = cx, y = top;
  ctx.beginPath();
  ctx.moveTo(x, y+s*.35);
  ctx.bezierCurveTo(x, y, x-s*.5, y, x-s*.5, y+s*.3);
  ctx.bezierCurveTo(x-s*.5, y+s*.6, x, y+s*.8, x, y+s);
  ctx.bezierCurveTo(x, y+s*.8, x+s*.5, y+s*.6, x+s*.5, y+s*.3);

// logo da ON (somente o símbolo, sem a palavra Engenharia), recortado do logo do cabeçalho

function skyGrad(stops){

/* ---------- Cenário 1: campo com pivô de irrigação ---------- */
function barn(x,y0){
  ctx.fillStyle = '#CBD6E0'; ctx.fillRect(x+84,y0-70,24,70);
  ctx.fillStyle = '#B2C0CD'; ctx.beginPath(); ctx.arc(x+96,y0-70,12,Math.PI,0); ctx.fill();

  ctx.fillStyle = '#EADFD2'; ctx.fillRect(x+24,y0-26,28,26);
  ctx.strokeStyle = '#B5453C'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x+24,y0-26); ctx.lineTo(x+52,y0); ctx.moveTo(x+52,y0-26); ctx.lineTo(x+24,y0); ctx.stroke();
}
function pivot(x,y0,t){
  const span = 560, n = 5, sy = y0-64, drop = 6;
  ctx.fillStyle = '#9FB4C7'; ctx.fillRect(x-4,sy-12,8,y0-sy+12);
  ctx.fillStyle = C.navy; rr(x-13,sy+14,26,20,3); ctx.fill();
  mark(x-9,sy+19,18);
  ctx.strokeStyle = '#D7E2EC'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x,sy); ctx.lineTo(x+span,sy+drop); ctx.stroke();
  ctx.strokeStyle = '#90A6BA'; ctx.lineWidth = 1.5; ctx.beginPath();
  for(let k=0;k<span;k+=28){
    ctx.moveTo(x+k,sy+drop*k/span); ctx.lineTo(x+k+14,sy+drop*(k+14)/span+10); ctx.lineTo(x+k+28,sy+drop*(k+28)/span);
  }
  ctx.stroke();
  for(let i=1;i<=n;i++){
    const tx = x + span*i/n, ty = sy + drop*i/n, by = y0-7;
    ctx.strokeStyle = '#B7C6D4'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx-10,by); ctx.moveTo(tx,ty); ctx.lineTo(tx+10,by); ctx.stroke();
    ctx.strokeStyle = '#90A6BA'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(tx-5,ty+(by-ty)*.5); ctx.lineTo(tx+5,ty+(by-ty)*.5); ctx.stroke();
    wheel(tx-10,y0-5,6); wheel(tx+10,y0-5,6);
  }
  const speed = G.lit ? 2.2 : 1.3;
  ctx.fillStyle = 'rgba(132,206,250,.9)';
  for(let j=1;j<span/24;j++){
    const nx = x + j*24, ny = sy + drop*(j*24)/span + 10;
    ctx.fillRect(nx-.5,ny,1,8);
    for(let k=0;k<3;k++){
      const ph = mod(t*speed + j*.29 + k/3, 1);
      ctx.fillRect(nx + (k-1)*7*ph - 1, ny + 8 + ph*(y0-ny-14), 2, 3);
    }
  }
}

/* ---------- Cenário 2: usina solar ---------- */
function panel(x,y0,s,t,i){
  const w = 78*s, h = 32*s, top = y0 - 36*s, sk = 10*s;
  ctx.fillStyle = '#8FA3B6'; ctx.fillRect(x+w*.46,top+h*.55,3*s+1,y0-top-h*.55);
  ctx.fillStyle = G.lit ? '#2C68B8' : '#1B3F73';
  ctx.beginPath(); ctx.moveTo(x,top+sk); ctx.lineTo(x+w,top); ctx.lineTo(x+w,top+h-sk); ctx.lineTo(x,top+h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(163,207,240,.55)'; ctx.lineWidth = Math.max(.8,s); ctx.beginPath();
  for(let k=1;k<4;k++){ const f = k/4, fx = x + w*f; ctx.moveTo(fx, top+sk*(1-f)); ctx.lineTo(fx, top+h-sk*f); }
  for(let g=1;g<3;g++){ const f = g/3; ctx.moveTo(x, top+sk+(h-sk)*f); ctx.lineTo(x+w, top+(h-sk)*f); }
  ctx.stroke();
  ctx.strokeStyle = '#D7E4F0'; ctx.lineWidth = Math.max(1,1.4*s);
  ctx.beginPath(); ctx.moveTo(x,top+sk); ctx.lineTo(x+w,top); ctx.lineTo(x+w,top+h-sk); ctx.lineTo(x,top+h); ctx.closePath(); ctx.stroke();
  const gl = mod(t*.35 + i*.17, 1.8) - .35;
  if(gl > 0 && gl < 1){
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    const f0 = gl, f1 = Math.min(1,gl+.14);
    ctx.beginPath(); ctx.moveTo(x+w*f0, top+sk*(1-f0)); ctx.lineTo(x+w*f1, top+sk*(1-f1)); ctx.lineTo(x+w*f1, top+h-sk*f1); ctx.lineTo(x+w*f0, top+h-sk*f0); ctx.closePath(); ctx.fill();
  }
}

function skyline(off,gap,col,hMin,hVar,litv,seed){
  rep(off,gap,120,(x,i)=>{
    const bx = x + hs(i,1,seed)*24, bw = 54 + hs(i,2,seed)*34, bh = hMin + hs(i,3,seed)*hVar, top = GY+10-bh;
    ctx.fillStyle = col; ctx.fillRect(bx,top,bw,bh);

    for(let wy=top+10, j=0; wy<GY-12; wy+=16, j++) for(let wx=bx+7, k=0; wx<bx+bw-9; wx+=12, k++) if(hs(i,k,j+seed) >= litv) ctx.rect(wx,wy,6,8);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,214,110,.95)'; ctx.beginPath();
    for(let wy=top+10, j=0; wy<GY-12; wy+=16, j++) for(let wx=bx+7, k=0; wx<bx+bw-9; wx+=12, k++) if(hs(i,k,j+seed) < litv) ctx.rect(wx,wy,6,8);

/* ---------- Cenário 4: subestação à noite ---------- */
function towerLine(off,gap,base,h,w,sc,t){
  const n = 6, hw = k => (w/2)*(1-k/n*.86), L = w*.8;
  rep(off,gap,160,(x,i)=>{
    ctx.strokeStyle = '#3E5A78'; ctx.lineWidth = 2*sc; ctx.beginPath();
    ctx.moveTo(x-hw(0),base); ctx.lineTo(x-hw(n),base-h); ctx.moveTo(x+hw(0),base); ctx.lineTo(x+hw(n),base-h);
    for(let k=0;k<=n;k++){
      const y = base-h*k/n; ctx.moveTo(x-hw(k),y); ctx.lineTo(x+hw(k),y);
      if(k<n){ const y2 = base-h*(k+1)/n; ctx.moveTo(x-hw(k),y); ctx.lineTo(x+hw(k+1),y2); ctx.moveTo(x+hw(k),y); ctx.lineTo(x-hw(k+1),y2); }
    }
    ctx.stroke();
    const arms = [base-h*.8, base-h*.55];
    ctx.lineWidth = 2.4*sc; ctx.beginPath();
    arms.forEach(ay => { ctx.moveTo(x-L,ay); ctx.lineTo(x+L,ay); });
    ctx.stroke();
    ctx.fillStyle = '#A3CFF0';
    arms.forEach(ay => { [-L,L].forEach(dx => ctx.fillRect(x+dx-1.5*sc,ay,3*sc,9*sc)); });
    const cables = [];
    arms.forEach(ay => { [-L,L].forEach(dx => cables.push([x+dx,ay+9*sc])); });
    const sag = 26*sc;
    const trace = () => { cables.forEach(([cx,cy]) => { ctx.moveTo(cx,cy); ctx.quadraticCurveTo(cx+gap/2,cy+sag,cx+gap,cy); }); };
    if(G.lit){ ctx.strokeStyle = 'rgba(114,175,224,.28)'; ctx.lineWidth = 6*sc; ctx.beginPath(); trace(); ctx.stroke(); }
    ctx.strokeStyle = G.lit ? '#D4EBFF' : 'rgba(114,175,224,.5)'; ctx.lineWidth = 1.4*sc; ctx.beginPath(); trace(); ctx.stroke();
  });
}

/* ---------- Desenho: chão e plataformas ---------- */
function drawGround(s,sx,th){
  const g = GROUND[th];
  ctx.fillStyle = g.body; ctx.fillRect(sx,s.y,s.w,H-s.y);
  ctx.fillStyle = g.top; ctx.fillRect(sx,s.y,s.w,g.topH);
  const k0 = Math.max(0, Math.floor(-sx/28) - 1), k1 = Math.min(Math.floor(s.w/28), Math.ceil((W-sx)/28) + 1);
  ctx.fillStyle = g.dot;
  for(let k=k0;k<k1;k++){
    const dx = sx + 14 + k*28 + hs(k,s.x)*10, dy = s.y + g.topH + 12 + hs(k,s.x,1)*50;
    ctx.beginPath(); ctx.arc(dx,dy,2+hs(k,s.x,2)*3,0,TAU); ctx.fill();
  }
  if(th === 0){
    ctx.fillStyle = '#4C9A3B'; ctx.beginPath();
    for(let k=Math.max(0,Math.floor(-sx/10)); k<Math.min(s.w/10,(W-sx)/10+1); k++){
      const bx = sx + k*10; ctx.moveTo(bx,s.y); ctx.lineTo(bx+3,s.y-5-hs(k,s.x,5)*4); ctx.lineTo(bx+6,s.y);
    }
    ctx.fill();
  }
  if(g.lane){
    ctx.fillStyle = 'rgba(247,201,76,.8)';
    const a0 = Math.max(0,Math.floor(-sx/50)-1), a1 = Math.min(Math.floor(s.w/50),Math.ceil((W-sx)/50)+1);
    for(let a=a0;a<a1;a++) ctx.fillRect(sx+a*50+10,s.y+g.topH+30,26,3);
  }
  if(g.edge){ ctx.fillStyle = C.on; ctx.fillRect(sx,s.y,s.w,2); }
}
function drawPlat(s,sx,th){
  const y = s.y, w = s.w;
  if(th === 0){                                       // fardo de feno
    ctx.fillStyle = '#E2AE48'; rr(sx,y,w,18,5); ctx.fill();
    ctx.fillStyle = '#F2CC74'; ctx.fillRect(sx+4,y+2,w-8,3);
    ctx.strokeStyle = '#B98A2E'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(sx+4,y+10); ctx.lineTo(sx+w-4,y+10);
    for(let xx=sx+14; xx<sx+w-6; xx+=22){ ctx.moveTo(xx,y+3); ctx.lineTo(xx,y+16); }
    ctx.stroke();
  } else if(th === 1){                                // placa solar
    ctx.fillStyle = '#D5E1EC'; ctx.fillRect(sx,y,w,18);
    ctx.fillStyle = '#1C4079'; ctx.fillRect(sx+2,y+3,w-4,13);
    ctx.strokeStyle = 'rgba(163,207,240,.7)'; ctx.lineWidth = 1; ctx.beginPath();
    for(let xx=sx+2+(w-4)/5; xx<sx+w-3; xx+=(w-4)/5){ ctx.moveTo(xx,y+3); ctx.lineTo(xx,y+16); }
    ctx.moveTo(sx+2,y+9.5); ctx.lineTo(sx+w-2,y+9.5); ctx.stroke();
  } else if(th === 2){                                // contêiner
    const cols = ['#2E6FB0','#E9EEF4','#33485F'];
    const col = cols[Math.floor(s.v*3)%3];
    ctx.fillStyle = col; ctx.fillRect(sx,y,w,18);
    ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(sx,y,w,3);
    ctx.strokeStyle = 'rgba(10,20,32,.3)'; ctx.lineWidth = 1.5; ctx.beginPath();
    for(let xx=sx+8; xx<sx+w-4; xx+=10){ ctx.moveTo(xx,y+4); ctx.lineTo(xx,y+16); }
    ctx.stroke();
    ctx.strokeStyle = '#0E1822'; ctx.lineWidth = 2; ctx.strokeRect(sx+1,y+1,w-2,16);
  } else {                                            // passarela metálica
    ctx.fillStyle = '#5A7290'; ctx.fillRect(sx,y,w,18);
    ctx.fillStyle = '#9DB6D2'; ctx.fillRect(sx,y,w,4);
    ctx.strokeStyle = '#2C4259'; ctx.lineWidth = 1.5; ctx.beginPath();
    for(let xx=sx; xx<sx+w-8; xx+=16){ ctx.moveTo(xx+2,y+5); ctx.lineTo(xx+14,y+17); ctx.moveTo(xx+14,y+5); ctx.lineTo(xx+2,y+17); }
    ctx.stroke();
    ctx.fillStyle = C.on; ctx.fillRect(sx,y+14,4,4); ctx.fillRect(sx+w-4,y+14,4,4);
  }
}

/* ---------- Desenho: ferramentas, objetos e personagens ---------- */
function drawTool(type,cx,cy,sc,rot){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot||0); ctx.scale(sc,sc);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if(type === 0){                       // alicate
    ctx.strokeStyle = '#E5584E'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-1,2); ctx.lineTo(-6,12); ctx.moveTo(1,2); ctx.lineTo(6,12); ctx.stroke();
    ctx.fillStyle = '#C9D3E0'; ctx.beginPath(); ctx.moveTo(-6,-11); ctx.lineTo(-1,-11); ctx.lineTo(1.5,3); ctx.lineTo(-1.5,3); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6,-11); ctx.lineTo(1,-11); ctx.lineTo(-1.5,3); ctx.lineTo(1.5,3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5E6E82'; ctx.beginPath(); ctx.arc(0,1,2.4,0,TAU); ctx.fill();
  } else if(type === 1){                // chave de fenda
    ctx.strokeStyle = '#C9D3E0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,1); ctx.stroke();
    ctx.fillStyle = '#8795A8'; ctx.fillRect(-2.6,-13,5.2,3);
    ctx.fillStyle = C.on; rr(-4.5,0,9,13,3.5); ctx.fill();
    ctx.strokeStyle = '#0F1E2B'; ctx.lineWidth = 1.2; ctx.stroke();
  } else if(type === 2){                // martelo
    ctx.strokeStyle = '#A9743F'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(0,13); ctx.stroke();
    ctx.fillStyle = '#6F7F93'; rr(-9,-11,18,8,2); ctx.fill();
    ctx.fillStyle = '#B7C4D3'; ctx.fillRect(-9,-11,18,2.5);
    ctx.fillStyle = '#6F7F93'; ctx.beginPath(); ctx.moveTo(9,-9); ctx.lineTo(13,-6); ctx.lineTo(9,-4); ctx.closePath(); ctx.fill();
  } else if(type === 3){                // chave inglesa
    ctx.strokeStyle = '#C9D3E0'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(0,10); ctx.stroke();
    ctx.lineWidth = 4.2; ctx.beginPath(); ctx.arc(0,-6,5.6,Math.PI*.72,Math.PI*2.28); ctx.stroke();
    ctx.fillStyle = '#C9D3E0'; ctx.beginPath(); ctx.arc(0,12,3.6,0,TAU); ctx.fill();
    ctx.fillStyle = '#5E6E82'; ctx.beginPath(); ctx.arc(0,12,1.4,0,TAU); ctx.fill();
  } else if(type === 4){                // multímetro
    ctx.fillStyle = '#FFC61A'; rr(-7,-11,14,22,3); ctx.fill();
    ctx.strokeStyle = '#0F1E2B'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = '#B6F0CF'; ctx.fillRect(-4.6,-8.4,9.2,5.6);
    ctx.fillStyle = '#0F1E2B'; ctx.beginPath(); ctx.arc(0,3.6,3.4,0,TAU); ctx.fill();
    ctx.fillStyle = '#FFC61A'; ctx.fillRect(-.7,.6,1.4,3);
  } else {                              // fita isolante
    ctx.fillStyle = '#1C2A3A';
    ctx.beginPath(); ctx.arc(0,0,9,0,TAU); ctx.moveTo(3.8,0); ctx.arc(0,0,3.8,0,TAU,true); ctx.fill('evenodd');
    ctx.strokeStyle = C.onB; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0,0,9,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,3.8,0,TAU); ctx.stroke();
  }
  ctx.restore();
}
function drawGoal(g,cam,tag){
  const x = g.x - cam; if(x > W || x + g.w < 0) return;
  const on = G.lit;
  ctx.fillStyle = C.navy; rr(x,g.y,g.w,g.h,7); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = on ? '#CFE8FF' : C.on; ctx.stroke();
  ctx.fillStyle = '#12202C'; rr(x+6,g.y+6,g.w-12,15,3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 9px Montserrat, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(tag, x+g.w/2, g.y+14);
  ctx.fillStyle = on ? '#43E0A0' : '#E0453A';
  ctx.beginPath(); ctx.arc(x+g.w/2,g.y+36,10,0,TAU); ctx.fill();
  ctx.fillStyle = '#0C1722'; ctx.font = '900 9px Montserrat, sans-serif'; ctx.fillText(on ? 'ON' : 'OFF', x+g.w/2, g.y+36.5);
  for(let i=0;i<3;i++){
    ctx.fillStyle = i < G.qDone ? '#43E0A0' : '#2E4A62';
    ctx.beginPath(); ctx.arc(x+g.w/2 - 12 + i*12, g.y+g.h-11, 3.8, 0, TAU); ctx.fill();
  }
}
function drawBlock(q,cam,t){
  const x = q.x - cam; if(x > W || x + q.w < 0) return;
  const y = q.y + (q.done ? 0 : Math.sin(t*3+q.x)*2);
  ctx.fillStyle = q.done ? '#5B6F83' : C.on; rr(x,y,q.w,q.h,6); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = C.navyD; ctx.stroke();
  ctx.fillStyle = q.done ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.4)'; ctx.fillRect(x+5,y+5,q.w-10,4);
  if(q.done){
    ctx.strokeStyle = '#43E0A0'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x+10,y+19); ctx.lineTo(x+16,y+25); ctx.lineTo(x+27,y+12); ctx.stroke();
  } else {
    ctx.fillStyle = '#12202C'; ctx.font = '900 24px Montserrat, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', x+q.w/2, y+q.h/2+3);
  }
}
function drawToolItem(b,cam,t){
  const x = b.x - cam; if(x < -24 || x > W+24) return;
  const y = b.y + Math.sin(t*4+b.ph)*3;
  glow(x,y,20,'rgba(163,207,240,A)',.35);
  drawTool(b.type,x,y,.9,Math.sin(t*2+b.ph)*.18);
}
function eyes(cx,cy,dir){
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx-5,cy,4,0,TAU); ctx.arc(cx+5,cy,4,0,TAU); ctx.fill();
  ctx.fillStyle = '#0F1E2B'; ctx.beginPath(); ctx.arc(cx-5+dir*1.4,cy+.5,1.9,0,TAU); ctx.arc(cx+5+dir*1.4,cy+.5,1.9,0,TAU); ctx.fill();
  ctx.strokeStyle = '#0F1E2B'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx-9,cy-6); ctx.lineTo(cx-2,cy-3); ctx.moveTo(cx+9,cy-6); ctx.lineTo(cx+2,cy-3); ctx.stroke();
}
function drawEnemy(e,cam,t){
  const x = e.x - cam; if(x < -60 || x > W+60) return;
  ctx.save();
  if(e.dead){ ctx.translate(x, e.y+e.h); ctx.scale(1,.3); ctx.translate(-x, -(e.y+e.h)); ctx.globalAlpha = Math.max(0,1-e.dead/.4); }
  const cx = x + e.w/2, cy = e.y + e.h/2;
  if(e.t === 'bug'){
    const s = Math.sin(e.anim*12)*2;
    ctx.strokeStyle = '#1B3F26'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
    [-10,-2,8].forEach((dx,k) => { ctx.moveTo(cx+dx,cy+8); ctx.lineTo(cx+dx-4+(k%2?s:-s),cy+13); });
    ctx.stroke();
    ctx.fillStyle = '#2F8A44'; ctx.beginPath(); ctx.ellipse(cx,cy+2,e.w/2,e.h/2-1,0,Math.PI,TAU); ctx.lineTo(cx+e.w/2,cy+8); ctx.lineTo(cx-e.w/2,cy+8); ctx.fill();
    ctx.strokeStyle = '#1F6130'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx,cy-10); ctx.lineTo(cx,cy+8); ctx.stroke();
    ctx.fillStyle = '#A8E3A0'; ctx.beginPath(); ctx.arc(cx-8,cy-2,2.4,0,TAU); ctx.arc(cx+9,cy-3,2.4,0,TAU); ctx.fill();
    ctx.save(); ctx.translate(e.dir*8,2); eyes(cx,cy+1,e.dir); ctx.restore();
  } else if(e.t === 'cloud'){
    const by = Math.sin(e.anim*3)*2;
    ctx.translate(0,by);
    ctx.fillStyle = '#6F7F96'; ctx.beginPath();
    ctx.arc(cx-12,cy+3,10,0,TAU); ctx.arc(cx,cy-3,13,0,TAU); ctx.arc(cx+13,cy+3,10,0,TAU); ctx.rect(cx-14,cy+2,28,11); ctx.fill();
    ctx.fillStyle = '#8A9AB0'; ctx.beginPath(); ctx.arc(cx-3,cy-8,6,0,TAU); ctx.fill();
    eyes(cx,cy+3,e.dir);
  } else if(e.t === 'spark'){
    ctx.fillStyle = '#FFD23F';
    for(let i=0;i<8;i++){
      const a = e.anim*3 + i*Math.PI/4;
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(a-.25)*10,cy+Math.sin(a-.25)*10); ctx.lineTo(cx+Math.cos(a)*17,cy+Math.sin(a)*17); ctx.lineTo(cx+Math.cos(a+.25)*10,cy+Math.sin(a+.25)*10); ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx,cy,11,0,TAU); ctx.fill();
    eyes(cx,cy,e.dir);
  } else {
    glow(cx,cy,34,'rgba(114,175,224,A)',.55);
    ctx.strokeStyle = '#CFE8FF'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
    for(let i=0;i<7;i++){
      const a = e.anim*2.4 + i*TAU/7, r1 = 11, r2 = 18 + (Math.sin(e.anim*14+i*2)*3);
      ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
      ctx.lineTo(cx+Math.cos(a+.12)*(r1+r2)/2,cy+Math.sin(a+.12)*(r1+r2)/2);
      ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
    }
    ctx.stroke();
    ctx.fillStyle = '#72AFE0'; ctx.beginPath(); ctx.arc(cx,cy,11,0,TAU); ctx.fill();
    eyes(cx,cy,e.dir);
  }
  ctx.restore();
}
function limb(x1,y1,x2,y2,w,col){
  ctx.lineCap = 'round';
  ctx.strokeStyle = C.ink; ctx.lineWidth = w+2.6; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function drawPlayer(cam){
  if(P.inv > 0 && Math.floor(P.inv*12)%2 === 0) ctx.globalAlpha = .4;
  const moving = Math.abs(P.vx) > 20 && P.on, s = moving ? Math.sin(P.anim*14) : 0, air = !P.on;
  const bob = moving ? Math.abs(s)*-1 : 0;
  ctx.save(); ctx.translate(P.x - cam + 12, P.y + bob);
  const SHIRT = '#2B5A8C', PANTS = '#22364F', SKIN = '#F1C7A0';
  // pernas
  const lift = [air ? 2 : Math.max(0,s)*3.2, air ? 2 : Math.max(0,-s)*3.2];
  [-7.2, 0.2].forEach((lx,k) => {
    const bottom = 40 - lift[k];
    ctx.fillStyle = PANTS; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4;
    rr(lx,28,7,bottom-28-3,2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4A3A2E'; rr(lx-1,bottom-5,9,5,2); ctx.fill(); ctx.stroke();
  });
  // braços
  const sw = moving ? s*4 : 0;
  if(air){ limb(-10,21,-15,12,5,SHIRT); limb(10,21,15,12,5,SHIRT); ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(-15.5,11,2.6,0,TAU); ctx.arc(15.5,11,2.6,0,TAU); ctx.fill(); }
  else { limb(-10,21,-12.5,29+sw*.3,5,SHIRT); limb(10,21,12.5,29-sw*.3,5,SHIRT); ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(-12.5,30+sw*.3,2.6,0,TAU); ctx.arc(12.5,30-sw*.3,2.6,0,TAU); ctx.fill(); }
  // corpo (uniforme azul com o símbolo da ON)
  ctx.fillStyle = SHIRT; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4; rr(-10,17,20,15,4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#DCE9F5'; ctx.fillRect(-9.3,28,18.6,2.2);
  mark(-6.4,19.2,12.8);
  // cinto e ferramentas coletadas
  ctx.fillStyle = C.ink; ctx.fillRect(-10,31,20,3);
  ctx.fillStyle = '#C9D6E2'; ctx.fillRect(-1.6,31,3.2,3);
  let slot = 0;
  for(let ty=0; ty<TOOLS.length; ty++){
    if(!G.toolSet.has(ty)) continue;
    drawTool(ty, -8.4 + slot*3.36, 33.8, .3, 0); slot++;
  }
  // cabeça
  ctx.fillStyle = SKIN; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(0,13.4,7.3,0,TAU); ctx.fill(); ctx.stroke();
  const ex = P.face*1.5;
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(-2.9+ex,14,1.3,0,TAU); ctx.arc(2.9+ex,14,1.3,0,TAU); ctx.fill();
  ctx.strokeStyle = '#9A5B3C'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(ex*.6,15.6,2.5,.15*Math.PI,.85*Math.PI); ctx.stroke();
  // capacete branco com o logo
  ctx.fillStyle = '#F6F9FC'; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0,9.4,10.6,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#DAE6F1'; rr(-12,8.6,24,3.4,1.7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#C3D4E4'; ctx.fillRect(-1.6,-1,3.2,5.5);
  mark(-5.6,1.4,11.2);
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawHUD(){
  ctx.fillStyle = 'rgba(8,16,26,.6)'; ctx.fillRect(0,0,W,40);
  for(let i=0;i<3;i++) heart(26+i*30,9,22,i < G.hearts);
  for(let k=0;k<TOOLS.length;k++){ ctx.globalAlpha = G.toolSet.has(k) ? 1 : .22; drawTool(k,136+k*21,20,.62,0); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#EAF4FD'; ctx.font = '800 17px Nunito, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(String(G.tools), 264, 21);
  ctx.fillStyle = C.on; rr(304,9,22,22,4); ctx.fill();
  ctx.fillStyle = '#12202C'; ctx.font = '900 15px Montserrat, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', 315, 21);
  ctx.fillStyle = '#EAF4FD'; ctx.font = '800 17px Nunito, sans-serif'; ctx.textAlign = 'left'; ctx.fillText(G.qDone + '/3', 334, 21);
  ctx.textAlign = 'center'; ctx.fillText(String(G.score).padStart(4,'0'), 450, 21);
  ctx.textAlign = 'right'; ctx.font = '800 14px Montserrat, sans-serif'; ctx.fillStyle = C.onB;
  ctx.fillText('FASE ' + (G.lvl+1) + ' · ' + LEVELS[G.lvl].name.toUpperCase(), W-14, 21);
  if(G.toast){
    const a = Math.min(1, G.toast.t*2);
    ctx.globalAlpha = a; ctx.font = '800 16px Nunito, sans-serif';
    const w = ctx.measureText(G.toast.text).width + 28;
    ctx.fillStyle = 'rgba(8,16,26,.86)'; rr(W/2-w/2,58,w,32,8); ctx.fill();
    ctx.strokeStyle = C.on; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#EAF4FD'; ctx.textAlign = 'center'; ctx.fillText(G.toast.text, W/2, 74.5);
    ctx.globalAlpha = 1;
  }
}
function render(){
  ctx.setTransform(scale,0,0,scale,0,0);
  const L = G.L, cam = G.cam, t = G.t, th = LEVELS[G.lvl].theme;
  SCENES[th](cam,t);
  ctx.fillStyle = GROUND[th].pit; ctx.fillRect(0,GY,W,H-GY);
  for(const s of L.plats){
    const sx = s.x - cam; if(sx > W || sx + s.w < 0) continue;
    s.ground ? drawGround(s,sx,th) : drawPlat(s,sx,th);
  }
  drawGoal(L.goal,cam,LEVELS[G.lvl].tag);
  for(const q of L.quiz) drawBlock(q,cam,t);
  for(const b of L.tools) if(!b.got) drawToolItem(b,cam,t);
  for(const e of L.enemies) drawEnemy(e,cam,t);
  if(G.state !== 'menu') drawPlayer(cam);
  for(const p of G.parts){ ctx.globalAlpha = clamp(p.life/p.max,0,1); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x-cam,p.y,p.r,0,TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  if(G.lit){
    const g = L.goal, gx = g.x + g.w/2 - cam, gy = g.y + 20, p = Math.min(1, G.lightsT/1.6);
    const rg = ctx.createRadialGradient(gx,gy,10,gx,gy,80+620*p);
    rg.addColorStop(0,'rgba(114,175,224,' + (.4*(1-p*.4)) + ')'); rg.addColorStop(1,'rgba(114,175,224,0)');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
    if(!REDUCED && G.lightsT < .35){ ctx.fillStyle = 'rgba(255,255,255,' + (.45*(1-G.lightsT/.35)) + ')'; ctx.fillRect(0,0,W,H); }
  }
  drawHUD();
}

/* ---------- Laço principal ---------- */
let last = 0;
function frame(ts){
  const dt = Math.min(.033, (ts - last)/1000 || 0); last = ts;
  update(dt); render();
  requestAnimationFrame(frame);
}
G.L = buildLevel(0);
showMenu();
requestAnimationFrame(frame);
})();
</script>

</body></html>
